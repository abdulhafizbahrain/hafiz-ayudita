<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media Check</title>
  <style>
    body{font-family:Arial,sans-serif;padding:20px;background:#fff8e1;color:#3b2b14}
    .card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.08)}
    video,audio,img{max-width:100%;display:block;margin-top:10px;border-radius:12px}
    code{background:#f4e6b3;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <h1>Media Check</h1>
  <p>Jika media di halaman ini bisa diputar/tampil, berarti file dan path sudah benar.</p>

  <div class="card">
    <h2>Audio</h2>
    <code>assets/audio/music.mp3</code>
    <audio controls src="assets/audio/music.mp3"></audio>
  </div>

  <div class="card">
    <h2>Video</h2>
    <code>assets/video/video.mp4</code>
    <video controls playsinline src="assets/video/video.mp4"></video>
  </div>

  <div class="card">
    <h2>Hero Background</h2>
    <code>assets/images/background-mobile.jpeg</code>
    <img src="assets/images/background-mobile.jpeg" alt="background mobile">
  </div>
</body>
</html>
